default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (locked)
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, jupyter]
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format (locked)
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi, jupyter]
        stages: [pre-commit]
      - id: ruff-check-all
        name: Ruff (all files)
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: ruff-format-check
        name: Ruff format (all files)
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: vulture
        name: Vulture (locked)
        entry: uv run --locked vulture src tests --min-confidence 80
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: coverage
        name: coverage (90% minimum)
        entry: uv run --locked --extra storage pytest --require-pyarrow --cov=src/lss4py --cov-fail-under=90
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: import-linter
        name: import-linter
        entry: uv run --locked import-linter lint --config lint_imports_config.ini
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: ty
        name: ty (type checker)
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true
