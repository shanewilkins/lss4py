default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [src, tests, --min-confidence, "80"]
        stages: [pre-push]
        always_run: true

  - repo: local
    hooks:
      - id: lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: import-linter
        name: import-linter
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: xenon
        name: xenon
        entry: uv run --locked xenon --max-absolute B --max-modules A --max-average A src/lss4py tests
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
