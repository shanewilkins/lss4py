[importlinter]
root_package = lss4py
doc_url = https://github.com/shanewilkins/lss4py/blob/master/docs/ARCHITECTURE.md

[importlinter:contract:1]
name = Domain Layer must be independent
type = forbidden
source_modules =
    lss4py.domain
forbidden_modules =
    lss4py.kernels
    lss4py.adapters
    lss4py.analytics
    lss4py.workflows
    lss4py.reporting
    lss4py.observability
    lss4py.cli
allow_indirect_imports = False

[importlinter:contract:2]
name = Kernel Layer - no adapters or analytics
type = forbidden
source_modules =
    lss4py.kernels
forbidden_modules =
    lss4py.adapters
    lss4py.analytics
    lss4py.workflows
    lss4py.reporting
    lss4py.observability
    lss4py.cli
allow_indirect_imports = False

[importlinter:contract:3]
name = Adapter Layer - no analytics or workflows
type = forbidden
source_modules =
    lss4py.adapters
forbidden_modules =
    lss4py.analytics
    lss4py.workflows
    lss4py.reporting
allow_indirect_imports = False

[importlinter:contract:4]
name = Analytics cannot depend on orchestration or IO layers
type = forbidden
source_modules =
    lss4py.analytics
forbidden_modules =
    lss4py.adapters
    lss4py.workflows
    lss4py.reporting
    lss4py.cli
allow_indirect_imports = False

[importlinter:contract:5]
name = Workflows cannot depend on adapters or internal layers
type = forbidden
source_modules =
    lss4py.workflows
forbidden_modules =
    lss4py.adapters
    lss4py.kernels
allow_indirect_imports = False

[importlinter:contract:6]
name = Reporting cannot depend on adapters or workflows
type = forbidden
source_modules =
    lss4py.reporting
forbidden_modules =
    lss4py.adapters
    lss4py.workflows
allow_indirect_imports = False

[importlinter:contract:7]
name = CLI cannot depend on internal layers
type = forbidden
source_modules =
    lss4py.cli
forbidden_modules =
    lss4py.kernels
    lss4py.adapters
allow_indirect_imports = False
