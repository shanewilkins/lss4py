[importlinter]
root_package = lss4py
doc_url = https://github.com/shanewilkins/lss4py/blob/master/docs/ARCHITECTURE.md

[importlinter:contract:1]
name = Domain Layer must be independent
type = forbidden
source_modules =
    lss4py.domain
forbidden_modules =
    lss4py._kernels
    lss4py.adapters
    lss4py.workflows
    lss4py.reporting
    lss4py.observability
    lss4py.cli
    lss4py.guidance
    lss4py.integration
allow_indirect_imports = False

[importlinter:contract:2]
name = Private kernel layer has no IO or orchestration dependencies
type = forbidden
source_modules =
    lss4py._kernels
forbidden_modules =
    lss4py.adapters
    lss4py.workflows
    lss4py.reporting
    lss4py.observability
    lss4py.cli
    lss4py.integration
allow_indirect_imports = False

[importlinter:contract:3]
name = Adapter layer has no analytical or orchestration dependencies
type = forbidden
source_modules =
    lss4py.adapters
forbidden_modules =
    lss4py._kernels
    lss4py.workflows
    lss4py.reporting
    lss4py.integration
allow_indirect_imports = False

[importlinter:contract:5]
name = Workflows cannot depend on adapters or internal layers
type = forbidden
source_modules =
    lss4py.workflows
forbidden_modules =
    lss4py.adapters
    lss4py._kernels
allow_indirect_imports = False

[importlinter:contract:6]
name = Reporting cannot depend on adapters or workflows
type = forbidden
source_modules =
    lss4py.reporting
forbidden_modules =
    lss4py._kernels
    lss4py.adapters
    lss4py.workflows
    lss4py.integration
allow_indirect_imports = False

[importlinter:contract:9]
name = Ecosystem bridge uses only domain contracts
type = forbidden
source_modules =
    lss4py.integration
forbidden_modules =
    lss4py._kernels
    lss4py.adapters
    lss4py.workflows
    lss4py.reporting
    lss4py.observability
    lss4py.cli
    lss4py.guidance
allow_indirect_imports = False

[importlinter:contract:7]
name = CLI cannot depend on internal layers
type = forbidden
source_modules =
    lss4py.cli
forbidden_modules =
    lss4py._kernels
    lss4py.adapters
allow_indirect_imports = False

[importlinter:contract:8]
name = Guidance cannot execute analytical or IO layers
type = forbidden
source_modules =
    lss4py.guidance
forbidden_modules =
    lss4py._kernels
    lss4py.adapters
    lss4py.workflows
    lss4py.reporting
    lss4py.observability
    lss4py.cli
allow_indirect_imports = False
