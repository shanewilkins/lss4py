[project]
name = "lss4py"
version = "0.2.0"
description = "Python-first Lean Six Sigma analytics for telemetry-rich process improvement"
readme = "README.md"
license = "MIT"
authors = [
    { name = "shanewilkins", email = "shane@wilkinsadvisors.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "click>=8.1.0",
    "narwhals>=1.0.0",
    "numpy>=2.2.0",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-exporter-otlp>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "polars>=1.0.0",
    "rich>=13.9.0",
    "scipy>=1.15.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
integration = [
    "flo-lang==0.4.2",
]
pandas = [
    "pandas>=2.2.0",
]
process-mining = [
    "pm4py>=2.7.0",
]
simulation = [
    "simpy>=4.1.0",
]
optimization = [
    "pulp>=2.9.0",
    "pyomo>=6.8.0",
]
visualization = [
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]
storage = [
    "duckdb>=1.2.0",
    "pyarrow>=19.0.0",
]

[project.scripts]
lss4py = "lss4py.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "matplotlib>=3.10.0",  # Optional plotting contract development and typing
    "pandas>=2.2.0",  # Backend parity tests
    "pip-audit>=2.6.0",  # Dependency vulnerabilities
    "pre-commit>=4.1.0",
    "pyarrow>=19.0.0",  # Type and contract checks for every supported backend
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.2",  # Lint, formatting, docstrings and function complexity
    "seaborn>=0.13.0",  # Optional plotting contract development and typing
    "twine>=6.0.0",  # Distribution metadata validation
    "ty>=0.0.77",  # Astral type checker
    "vulture>=2.13",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    "C901", "D", "C4", "PIE",
    "RUF100", "RUF043", "PT012", "SIM102", "SIM114",
    "S", "PLE2502",  # Security and bidirectional Unicode source checks
]
ignore = ["D100", "D101", "D104", "S101"]  # Preserve the former Bandit B101 exemption

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]
"e2e/**" = ["D", "S"]
# Match the former security scan's production-source scope.
"tools/**" = ["S"]
"examples/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/lss4py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
exclude = ["*/__init__.py"]
