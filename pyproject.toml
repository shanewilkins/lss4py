[project]
name = "lss4py"
version = "0.2.0"
description = "Python-first Lean Six Sigma analytics for telemetry-rich process improvement"
readme = "README.md"
license = "MIT"
authors = [
    { name = "shanewilkins", email = "shane@wilkinsadvisors.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "click>=8.1.0",
    "narwhals>=1.0.0",
    "numpy>=2.2.0",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-exporter-otlp>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "polars>=1.0.0",
    "rich>=13.9.0",
    "scipy>=1.15.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
integration = [
    "flo-lang==0.4.2",
]
pandas = [
    "pandas>=2.2.0",
]
process-mining = [
    "pm4py>=2.7.0",
]
simulation = [
    "simpy>=4.1.0",
]
optimization = [
    "pulp>=2.9.0",
    "pyomo>=6.8.0",
]
visualization = [
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]
storage = [
    "duckdb>=1.2.0",
    "pyarrow>=19.0.0",
]

[project.scripts]
lss4py = "lss4py.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.8.0",  # Security scanning
    "import-linter>=2.1",
    "matplotlib>=3.10.0",  # Optional plotting contract development and typing
    "interrogate>=1.5.0",  # Docstring coverage
    "pandas>=2.2.0",  # Backend parity tests
    "pip-audit>=2.6.0",  # Dependency vulnerabilities
    "pre-commit>=4.1.0",
    "pydocstyle>=6.3.0",  # Docstring formatting
    "pyarrow>=19.0.0",  # Type and contract checks for every supported backend
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "seaborn>=0.13.0",  # Optional plotting contract development and typing
    "twine>=6.0.0",  # Distribution metadata validation
    "ty>=0.0.77",  # Astral type checker
    "vulture>=2.13",
    "xenon>=0.9.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/lss4py"]
omit = [
    "src/lss4py/_event_log.py",  # v0.3 refactor
    "src/lss4py/adapters/*",
    "src/lss4py/cli.py",
    "src/lss4py/observability/*",
    "src/lss4py/reporting/*",
    "src/lss4py/workflows/bottleneck.py",
    "src/lss4py/workflows/comparison.py",
    "src/lss4py/workflows/simulation.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D101", "D104"]  # Ignore module, class, and package docstrings (will enforce later)

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
fail-under = 80
verbose = 2
exclude = ["src/lss4py/adapters", "src/lss4py/observability", "src/lss4py/reporting", "src/lss4py/workflows", "tests"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
exclude = ["*/__init__.py"]
