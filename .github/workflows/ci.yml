name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Validate lockfile
        run: uv lock --check

      - name: Ruff
        run: uv run --locked ruff check .

      - name: Import Linter
        run: uv run --locked import-linter lint --config lint_imports_config.ini

      - name: Vulture
        run: uv run --locked vulture src tests --min-confidence 80

      - name: Xenon
        run: uv run --locked xenon --max-absolute B --max-modules A --max-average A src/lss4py tests

      - name: Bandit (Security)
        run: uv run --locked bandit -r src/lss4py --skip B101

      - name: Pip Audit (Dependency Vulnerabilities)
        run: uv run --locked pip-audit --desc

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Type Check (ty)
        run: uv run --locked ty check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync development dependencies
        run: uv sync --locked --group dev --extra storage

      - name: Pytest
        run: uv run --locked --extra storage pytest --require-pyarrow --cov=src/lss4py --cov-report=term-missing

  smoke:
    needs:
      - lint
      - typecheck
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Test customer workflows against the built wheel
        run: python tools/check_wheel.py --ecosystem --artifacts-dir artifacts/ecosystem

      - name: Preserve ecosystem evidence and exported graphics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-baseline
          path: artifacts/ecosystem
          if-no-files-found: ignore
