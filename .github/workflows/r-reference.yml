name: R reference verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/r-reference/**"
      - "tests/fixtures/reference/**"
      - ".github/workflows/r-reference.yml"
  push:
    branches: [master]
    paths:
      - "tools/r-reference/**"
      - "tests/fixtures/reference/**"
      - ".github/workflows/r-reference.yml"

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Restore isolated R dependencies
        run: Rscript --vanilla tools/r-reference/bootstrap.R
      - name: Verify SixSigma reference outputs
        run: Rscript --vanilla tools/r-reference/verify.R
